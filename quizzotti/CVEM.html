<style>
  .cv-layout { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 980px) { .cv-layout { grid-template-columns: minmax(0, 1fr) 260px; align-items: start; } }

  .cv-top { display: flex; align-items: center; gap: 16px; }
  .cv-prize { display: grid; }
  .cv-prize__label { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .cv-prize__value { font-family: var(--font-display); font-size: clamp(24px, 4vw, 34px); font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

  .cv-question { padding: 26px 24px; text-align: center; }
  .cv-question .eyebrow { justify-content: center; margin-bottom: 12px; }

  .cv-lifelines { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 420px) { .cv-life { font-size: 11px; padding: 10px 2px 8px; } .cv-life .cv-life__ico { width: 34px; height: 34px; font-size: 11px; } .cv-question { padding: 20px 16px; } }
  .cv-life { display: grid; justify-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); font-weight: 800; font-size: 12px; transition: transform .2s var(--ease-spring), background .2s, border-color .2s, opacity .3s; }
  .cv-life:hover:not(:disabled) { transform: translateY(-3px); border-color: rgba(var(--accent-rgb), .6); background: rgba(var(--accent-rgb), .1); }
  .cv-life .cv-life__ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(var(--accent-rgb), .14); color: var(--accent); font-family: var(--font-display); font-size: 13px; }
  .cv-life:disabled { opacity: .3; cursor: not-allowed; }
  .cv-life:disabled .cv-life__ico { background: var(--surface-2); color: var(--faint); }
  .cv-life--quit .cv-life__ico { background: rgba(var(--ok-rgb), .14); color: var(--ok); }

  .cv-ladder { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column-reverse; gap: 3px; }
  .cv-ladder li { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; transition: background .4s, color .4s, transform .4s var(--ease-spring); }
  .cv-ladder li span:first-child { width: 22px; font-size: 12px; color: var(--faint); }
  .cv-ladder li span:last-child { margin-left: auto; }
  .cv-ladder li.is-safe { color: var(--text); }
  .cv-ladder li.is-safe span:last-child { color: var(--accent); }
  .cv-ladder li.is-done { color: var(--faint); }
  .cv-ladder li.is-done span:last-child::before { content: "✓ "; color: var(--ok); }
  .cv-ladder li.is-now { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: var(--on-accent); transform: scale(1.04); box-shadow: 0 8px 24px -8px rgba(var(--accent-rgb), .8); }
  .cv-ladder li.is-now span { color: inherit !important; }

  @media (max-width: 979px) {
    .cv-side { order: -1; }
    .cv-ladder { flex-direction: row; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 6px; }
    .cv-ladder::-webkit-scrollbar { display: none; }
    .cv-ladder li { flex: none; scroll-snap-align: center; padding: 8px 12px; font-size: 13px; }
    .cv-ladder li.is-now { transform: none; }
  }

  .cv-audience { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: end; height: 190px; margin-top: 12px; }
  .cv-audience__col { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; height: 100%; text-align: center; font-weight: 800; }
  .cv-audience__track { flex: 1; display: flex; align-items: flex-end; }
  .cv-audience__bar { width: 100%; height: 0; border-radius: 10px 10px 4px 4px; background: linear-gradient(180deg, var(--accent-2), var(--accent)); transition: height 1s var(--ease-out); }
  .cv-audience__col span:last-child { font-family: var(--font-display); color: var(--accent); }
</style>
</head>
<body data-game="cvem">
<main id="app" class="qz-main" tabindex="-1">

  <!-- ============ INIZIO ============ -->
  <section class="screen is-active" id="s-start">
    <div class="intro">
      <div data-stagger>
        <span class="eyebrow">Quiz · Solo</span>
        <h1 class="intro__title">Chi vuol essere <em>milionario?</em></h1>
        <p class="intro__lead">Quindici domande di calcio, dalla più facile alla più difficile. Rispondi, usa gli aiuti al momento giusto e porta a casa il milione.</p>
        <div class="row mt-3">
          <button class="btn btn--primary btn--xl" type="button" id="start-btn" data-autofocus></button>
        </div>
        <p class="small muted mt-2" id="start-record"></p>
      </div>
      <div class="stack" style="--gap:22px;align-items:center">
        <div class="medal" id="medal"></div>
        <div class="card card--glow" style="width:100%">
          <ul class="rules" id="rules"></ul>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ PARTITA ============ -->
  <section class="screen" id="s-game">
    <div class="cv-layout">
      <div class="stack" style="--gap:18px">
        <div class="cv-top">
          <div id="timer-host"></div>
          <div class="cv-prize grow">
            <span class="cv-prize__label" id="q-label">Domanda 1 di 15</span>
            <span class="cv-prize__value" id="q-prize">€100</span>
          </div>
          <span class="streak" id="streak"></span>
        </div>

        <div class="card card--glow cv-question">
          <span class="eyebrow" id="q-cat"></span>
          <h2 class="question" id="question" aria-live="polite"></h2>
        </div>

        <div class="answers answers--2col" id="answers"></div>

        <div class="cv-lifelines" id="lifelines"></div>
        <p class="small faint center kbd-hint" style="justify-content:center;gap:6px">Tastiera: <span class="kbd">A</span><span class="kbd">B</span><span class="kbd">C</span><span class="kbd">D</span> per rispondere</p>
      </div>

      <aside class="cv-side card card--tight" aria-label="Montepremi">
        <ol class="cv-ladder" id="ladder"></ol>
      </aside>
    </div>
  </section>

  <!-- ============ FINE ============ -->
  <section class="screen" id="s-end"><div id="end-host" class="qz-main--narrow" style="margin:0 auto"></div></section>

</main>

</html>
