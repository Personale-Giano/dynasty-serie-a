<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chi l'ha detto · Quizzotti</title>
<meta name="description" content="Indovina il campione o l'allenatore dietro le frasi più celebri del calcio. Scrivi il nome o usa le opzioni: oltre 270 citazioni da riconoscere.">
<meta name="theme-color" content="#f1e8d6">
<meta property="og:type" content="website">
<meta property="og:title" content="Chi l'ha detto · Quizzotti">
<meta property="og:description" content="Le frasi più celebri del calcio: riconosci chi le ha pronunciate.">
<meta property="og:image" content="logo2.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="logo1.webp" type="image/webp">
<link rel="apple-touch-icon" href="logo1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="assets/qz.css?v=1faa7d11">
<style>
  .intro { grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .intro { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); } }
  .ch-setup { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 760px) { .ch-setup { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .ch-setup .segmented { flex-wrap: nowrap; }
  .ch-setup .segmented button { flex: 1 1 0; min-width: 0; padding: 0 6px; font-size: 13px; }
  .ch-game { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); max-width: 820px; margin: 0 auto; }
  .ch-top { display: flex; align-items: center; gap: 12px; }
  .ch-score { display: grid; line-height: 1; }
  .ch-score__label { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .ch-score__value { font-family: var(--font-display); font-size: clamp(28px, 6vw, 40px); font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .ch-top .timer-ring { --size: 58px; }

  .ch-quote { padding: 34px 22px 26px; text-align: center; overflow: hidden; }
  .ch-quote__mark { position: absolute; top: -8px; left: 12px; width: 92px; height: 92px; color: rgba(var(--accent-rgb), .16); }
  .ch-quote__mark .ico { width: 100%; height: 100%; fill: currentcolor; stroke: none; }
  .ch-quote .eyebrow { justify-content: center; margin-bottom: 14px; }
  .ch-quote .question { position: relative; font-size: clamp(19px, 3.3vw, 28px); font-weight: 500; font-style: italic; }

  .ch-type { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
  .ch-type .btn { padding: 0 18px; }
  .ch-tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .ch-tools .btn { flex: 1 1 auto; }
  .ch-hint { font-family: var(--font-display); font-size: 15px; letter-spacing: .12em; color: var(--accent-2); text-align: center; overflow-wrap: anywhere; }
  .ch-hint.is-in { animation: qz-pop-in .45s var(--ease-spring); }

  .ch-feedback { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
  .ch-feedback__ico { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
  .ch-feedback__ico .ico { width: 24px; height: 24px; }
  .ch-feedback.is-ok .ch-feedback__ico { background: rgba(var(--ok-rgb), .16); color: var(--ok); }
  .ch-feedback.is-bad .ch-feedback__ico { background: rgba(var(--bad-rgb), .16); color: var(--bad); }
  .ch-feedback__name { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
  .ch-feedback__pts { margin-left: auto; font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--ok); white-space: nowrap; }
  .ch-feedback.is-bad .ch-feedback__pts { color: var(--faint); }

  .ch-review { display: grid; gap: 8px; margin-top: 24px; text-align: left; }
  .ch-review summary { cursor: pointer; font-weight: 800; padding: 12px 0; }
  .ch-review__row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
  .ch-review__row .ico { flex: none; width: 18px; height: 18px; margin-top: 2px; }
  .ch-review__row q { display: block; font-style: italic; color: var(--muted); font-size: 14px; }
  .ch-review__row b { font-size: 14px; }
</style>
</head>
<body data-game="citazioni">
<main id="app" class="qz-main" tabindex="-1">

  <!-- ============ INIZIO ============ -->
  <section class="screen is-active" id="s-start">
    <div class="intro">
      <div data-stagger>
        <span class="eyebrow">Frasi celebri · Solo</span>
        <h1 class="intro__title">Chi l'ha <em>detto?</em></h1>
        <p class="intro__lead">Dalle conferenze stampa leggendarie alle battute in telecronaca: leggi la frase e scrivi chi l'ha pronunciata. Se non ti viene, apri le opzioni, ma valgono meno.</p>
        <div class="row mt-3">
          <button class="btn btn--primary btn--xl" type="button" id="start-btn" data-autofocus></button>
        </div>
        <p class="small muted mt-2" id="start-record"></p>
      </div>
      <div class="stack" style="--gap:22px;align-items:center">
        <div class="medal" id="medal"></div>
        <div class="card card--glow" style="width:100%">
          <ul class="rules" id="rules"></ul>
        </div>
      </div>
    </div>

    <div class="card card--flat mt-4">
      <div class="ch-setup">
        <div class="field"><span class="label" id="lbl-len">Frasi per partita</span><div id="set-len" aria-labelledby="lbl-len"></div></div>
        <div class="field"><span class="label" id="lbl-time">Tempo</span><div id="set-time" aria-labelledby="lbl-time"></div></div>
      </div>
    </div>
  </section>

  <!-- ============ PARTITA ============ -->
  <section class="screen" id="s-game">
    <div class="ch-game">
      <div class="ch-top">
        <div id="timer-host"></div>
        <div class="ch-score grow">
          <span class="ch-score__label" id="g-count">Frase 1 di 10</span>
          <span class="ch-score__value" id="g-score">0 punti</span>
        </div>
        <span class="streak" id="g-streak"></span>
      </div>
      <div class="progress"><div class="progress__fill" id="g-progress" style="transform:scaleX(0)"></div></div>

      <div class="card card--glow ch-quote" id="g-card">
        <span class="ch-quote__mark" id="g-mark" aria-hidden="true"></span>
        <span class="eyebrow" id="g-eyebrow"></span>
        <blockquote class="question" id="g-quote" style="margin:0" aria-live="polite"></blockquote>
      </div>

      <!-- risposta scritta -->
      <form class="stack" style="--gap:10px" id="g-typeform" autocomplete="off" novalidate>
        <label class="sr-only" for="g-input">Scrivi chi ha detto questa frase</label>
        <div class="ch-type">
          <input class="input input--lg" id="g-input" type="text" placeholder="Scrivi il nome…" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="send" maxlength="40">
          <button class="btn btn--primary btn--lg" type="submit" id="g-send"></button>
        </div>
        <p class="ch-hint" id="g-hint" hidden></p>
        <div class="ch-tools">
          <button class="btn btn--sm" type="button" id="g-options"></button>
          <button class="btn btn--sm" type="button" id="g-initials"></button>
          <button class="btn btn--sm btn--ghost" type="button" id="g-skip"></button>
        </div>
      </form>

      <!-- risposta a scelta multipla -->
      <div class="answers answers--2col" id="g-answers" hidden></div>

      <!-- esito -->
      <div id="g-result" hidden aria-live="polite">
        <div class="card card--tight ch-feedback" id="g-feedback"></div>
        <button class="btn btn--primary btn--lg btn--block mt-2" type="button" id="g-next"></button>
      </div>

      <p class="small faint center kbd-hint" style="justify-content:center;gap:6px" id="g-kbd"></p>
    </div>
  </section>

  <!-- ============ FINE ============ -->
  <section class="screen" id="s-end"><div id="end-host" class="qz-main--narrow" style="margin:0 auto"></div></section>

</main>

<script src="assets/qz.js?v=9c216f8a" defer></script>
<script src="assets/db-citazioni.js?v=2377bc04" defer></script>
<script src="assets/games/citazioni.js?v=69a5e432" defer></script>
</body>
</html>
